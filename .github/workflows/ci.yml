name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./processor/...

  go-build:
    runs-on: ubuntu-latest
    needs: go-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go build -tags timetzdata -o firewall-anomaly-detector .

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -r training/requirements.txt
          pip install -r model_server/requirements.txt pytest
      - name: Sanity-import
        run: |
          python -c "import sys; sys.path.insert(0, 'training'); import extract_features; print(extract_features.FEATURE_ORDER)"
          python -c "import sys; sys.path.insert(0, 'model_server'); from main import FEATURE_ORDER; print(FEATURE_ORDER)"
