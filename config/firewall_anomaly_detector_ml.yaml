# Production-style config: pull logs from Redis, score with the HTTP model
# server, route anomalies to a dedicated Kafka topic, drift-monitor inline.
input:
  redis_list:
    url: redis://redis:6379
    key: firewall_logs
    timeout: 5s

pipeline:
  threads: 4
  processors:
    - firewall_anomaly_detector:
        window_seconds: 60
        score_threshold: 0.7
        model_path: /models/firewall_anomaly.joblib
        scorer:
          type: http
          http_url: http://model-server:8000/score
          http_timeout_ms: 1500
          fallback_to_heuristic: true
        drift:
          enabled: true
          reservoir_size: 2048
          psi_threshold: 0.2
        redis_config:
          address: redis:6379
          db: 0
          key: firewall_logs
        kafka_config:
          brokers: [kafka:9092]
          anomaly_topic: firewall-anomalies
          normal_topic: firewall-normal
        sources:
          fortinet.firewall: { metric: connection_count }
          paloalto.firewall: { metric: bytes_sent }
          checkpoint.firewall: { metric: bytes_recv }
          cisco.asa: { metric: connection_count }
          juniper.srx: { metric: connection_count }

output:
  kafka:
    addresses: [kafka:9092]
    topic: ${! meta("topic") }

metrics:
  prometheus:
    use_histogram_timing: true

logger:
  level: INFO
  format: json
