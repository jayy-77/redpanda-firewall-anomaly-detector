global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: firewall-anomaly-detector
    static_configs:
      - targets: ["firewall-anomaly-detector:4195"]

  - job_name: model-server
    static_configs:
      - targets: ["model-server:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
